name: CI & Release Bundles

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-cross-platform:
    name: Test & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install --upgrade pip "numpy>=1.26"

      - name: Build PEP 723 Single-File Bundle & Universal Wheel
        run: python -B scripts/build_and_install.py --no-install

      - name: Run Full Geometry, 2-Manifold & Bridge Test Suite
        run: python -B -m unittest discover -s tests -v

  attach-release-assets:
    name: Upload Bundles to GitHub Release
    needs: test-cross-platform
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy & Build Dist Artifacts
        env:
          ORCA_PLUGIN_VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade pip "numpy>=1.26"
          python -B scripts/build_and_install.py --no-install

      - name: Attach .py and .whl to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/orca_vase_generator.py dist/orca_vase_generator_any.py dist/orca_vase_generator-*.whl src/vase_studio/icon.svg --clobber
