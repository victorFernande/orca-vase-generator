name: Publish to OrcaCloud

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["CI & Release Bundles"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to recover (for example v1.4.1)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/publish-orcacloud.yml
      - scripts/orcacloud_publish.py
      - scripts/test_orcacloud_publish.py

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate publisher without uploading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -B -W error -m unittest discover -s scripts -p test_orcacloud_publish.py -v

  publish:
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    name: Publish verified release (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: orcacloud-publish
      cancel-in-progress: false
    permissions:
      contents: write # Attach the successful publication receipt to the release.
      id-token: write
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
      PLUGIN_FILE: orca_vase_generator_any.py
      PLUGIN_ID: orca-vase-studio
      CLOUD_PLUGIN_ID: 51603699-f020-468b-b722-595265e8a0a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the publisher before using its identity token
        run: python -B -W error -m unittest discover -s scripts -p test_orcacloud_publish.py -v
      - name: Publish the exact tested release asset
        run: python -B -W error scripts/orcacloud_publish.py
