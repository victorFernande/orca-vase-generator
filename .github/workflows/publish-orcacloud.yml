name: Publish to OrcaCloud

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/publish-orcacloud.yml
      - scripts/orcacloud_publish.py
      - scripts/test_orcacloud_publish.py

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate publisher without uploading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -B -W error -m unittest discover -s scripts -p test_orcacloud_publish.py -v

  publish:
    if: github.event_name == 'release'
    name: Publish verified release (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: orcacloud-publish
      cancel-in-progress: false
    permissions:
      actions: read # Read CI approval for the exact released commit.
      contents: write # Attach the successful publication receipt to the release.
      id-token: write
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PLUGIN_FILE: orca_vase_generator_any.py
      PLUGIN_ID: orca-vase-studio
      PLUGIN_NAME: Orca Vase Studio
      CLOUD_PLUGIN_ID: 51603699-f020-468b-b722-595265e8a0a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the publisher before using its identity token
        run: python -B -W error -m unittest discover -s scripts -p test_orcacloud_publish.py -v
      - name: Publish the exact tested release asset
        run: python -B -W error scripts/orcacloud_publish.py
