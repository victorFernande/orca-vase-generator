[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-vase-generator"
version = "1.3.3"
description = "Parametric 3D Vase & Planter Studio with X-Ray Wall Calipers & 1-Click Plater | Estudio 3D de Vasos e Cachepos"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Orca Vase Studio" }
]
dependencies = [
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vase_studio = ["icon.svg", "locales/*.json"]

[tool.orcaslicer.plugin]
id = "orca-vase-studio"
name = "Orca Vase Studio"
description = "Parametric 3D Vase & Planter Studio with X-Ray Wall Calipers & 1-Click Plater | Estudio 3D de Vasos e Cachepos"
author = "Orca Vase Studio"
version = "1.3.3"
